name: 验证

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: 验证插件和技能
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          persist-credentials: false

      - name: 验证 JSON 文件
        run: |
          echo "正在验证 marketplace.json..."
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null

          echo "正在验证 plugin.json 文件..."
          for f in plugins/*/.claude-plugin/plugin.json; do
            echo "  正在检查 $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: 检查市场一致性
        run: |
          echo "正在检查所有市场插件是否有对应目录..."
          python3 -c "
          import json
          import os
          import sys

          with open('.claude-plugin/marketplace.json') as f:
              marketplace = json.load(f)

          errors = []
          for plugin in marketplace['plugins']:
              name = plugin['name']
              source = plugin['source']
              # source 类似 ./plugins/name
              path = source.lstrip('./')
              if not os.path.isdir(path):
                  errors.append(f'插件 {name}: 目录 {path} 未找到')

              plugin_json = os.path.join(path, '.claude-plugin', 'plugin.json')
              if not os.path.isfile(plugin_json):
                  errors.append(f'插件 {name}: 缺少 {plugin_json}')

          if errors:
              for e in errors:
                  print(f'错误: {e}', file=sys.stderr)
              sys.exit(1)

          print(f'已验证所有 {len(marketplace[\"plugins\"])} 个插件')
          "

      - name: 验证 SKILL.md 前置元数据
        run: |
          echo "正在检查 SKILL.md 前置元数据..."
          python3 -c "
          import os
          import re
          import sys

          errors = []
          skill_count = 0

          for root, dirs, files in os.walk('plugins'):
              for f in files:
                  if f == 'SKILL.md':
                      path = os.path.join(root, f)
                      skill_count += 1
                      with open(path) as fp:
                          content = fp.read()

                      # 检查前置元数据
                      if not content.startswith('---'):
                          errors.append(f'{path}: 缺少 YAML 前置元数据')
                          continue

                      # 提取前置元数据
                      match = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
                      if not match:
                          errors.append(f'{path}: 前置元数据格式错误')
                          continue

                      frontmatter = match.group(1)

                      # 检查必需字段
                      if 'name:' not in frontmatter:
                          errors.append(f'{path}: 前置元数据中缺少 \"name\"')
                      if 'description:' not in frontmatter:
                          errors.append(f'{path}: 前置元数据中缺少 \"description\"')

          if errors:
              for e in errors:
                  print(f'错误: {e}', file=sys.stderr)
              sys.exit(1)

          print(f'所有 {skill_count} 个 SKILL.md 文件都有有效的前置元数据')
          "

      - name: 检查硬编码路径
        run: |
          echo "正在检查硬编码的用户路径..."
          if grep -rE '/home/[a-z]|/Users/[A-Z]' plugins/ --include='*.md' --include='*.py' --include='*.json' | grep -v '/path/to'; then
            echo "错误: 发现硬编码的用户路径（见上文）"
            exit 1
          fi
          echo "未发现硬编码的用户路径"

      - name: 检查个人邮箱
        run: |
          echo "正在检查个人邮箱..."
          if grep -r '@trailofbits.com' . --include='*.json' --include='*.toml' | grep -v 'opensource@trailofbits.com' | grep -v '.git'; then
            echo "错误: 发现个人邮箱（应使用 opensource@trailofbits.com）"
            exit 1
          fi
          echo "未发现个人邮箱"
